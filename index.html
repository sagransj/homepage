<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field Target</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&family=Manrope:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>FIELD TARGET</span>
        </div>
        <div class="scoreboard" aria-label="Game status">
          <div>
            <span>Score</span>
            <strong id="score">000</strong>
          </div>
          <div>
            <span>Time</span>
            <strong id="time">30</strong>
          </div>
        </div>
      </header>

      <section class="arena" id="arena" aria-label="Shooting game arena">
        <canvas id="game-canvas"></canvas>

        <div class="start-screen" id="start-screen">
          <p class="eyebrow">Training exercise 01</p>
          <h1>Hit the<br /><em>targets.</em></h1>
          <p>Move the crosshair and shoot before the clock runs out.</p>
          <button id="start-button" type="button">
            <span>Start game</span>
            <span aria-hidden="true">↗</span>
          </button>
        </div>

        <div class="end-screen" id="end-screen" hidden>
          <p class="eyebrow">Exercise complete</p>
          <h2>Final score</h2>
          <strong id="final-score">000</strong>
          <button id="restart-button" type="button">
            <span>Play again</span>
            <span aria-hidden="true">↻</span>
          </button>
        </div>

        <div class="crosshair" id="crosshair" aria-hidden="true">
          <span></span>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
